<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>安全センター | おきとーーーーーーく</title><style>body{font-family:system-ui;background:#f4f8fb;color:#17384a}main{max-width:650px;margin:35px auto;padding:20px}section{background:white;border-radius:14px;padding:22px;margin-bottom:18px}label{display:block;margin-top:12px}input,textarea,select{width:100%;box-sizing:border-box;padding:10px;margin-top:5px}button{background:#176db5;color:white;border:0;border-radius:8px;padding:12px;margin-top:14px;cursor:pointer}</style></head><body><main><a href="home.html">← ホーム</a><h1>安全センター</h1><section><h2>通報する</h2><form id="reportForm"><label>対象<select id="kind"><option value="user">ユーザー</option><option value="post">投稿</option></select></label><label>対象ID（UUID）<input id="target" required placeholder="対象のID" autocomplete="off"></label><label>理由（5文字以上）<textarea id="reason" minlength="5" maxlength="1000" required></textarea></label><button>通報を送信</button></form></section><section><h2>ユーザーをブロックする</h2><form id="blockForm"><label>相手のユーザーID（UUID）<input id="blockTarget" required></label><button>ブロック</button></form><h3>ブロック中</h3><div id="blocked"></div></section><p id="notice" role="status"></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script type="module" src="../../js/pages/safety.js"></script></body></html>
