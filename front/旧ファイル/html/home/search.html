<!DOCTYPE html>

<head>

    <link rel="stylesheet" href="../../css/header.css">
    <link rel="stylesheet" href="../../css/button.css">

</head>

<body>

    <!-- スマホ用メニューボタン -->
    <button
        type="button"
        id="mobileMenuButton"
        class="mobile-menu-button"
        aria-label="メニューを開く"
        aria-controls="mobileMenuDrawer"
        aria-expanded="false"
    >
        <span></span>
        <span></span>
        <span></span>
    </button>

    <!-- スマホ用メニュー -->
    <div
        id="mobileMenuDrawer"
        class="mobile-menu-drawer"
        aria-hidden="true"
    >
        <div id="mobileMenuBackdrop" class="mobile-menu-backdrop"></div>

        <aside class="mobile-menu-panel">
            <div class="mobile-menu-header">
                <strong>メニュー</strong>

                <button
                    type="button"
                    id="mobileMenuCloseButton"
                    class="mobile-menu-close-button"
                    aria-label="メニューを閉じる"
                >
                    ×
                </button>
            </div>

            <nav class="mobile-menu-navigation">
                <a href="../home.html" class="mobile-menu-link">
                    <span>⌂</span>
                    ホーム
                </a>

                <a href="search.html" class="mobile-menu-link active">
                    <span>⌕</span>
                    検索
                </a>

                <a href="community.html" class="mobile-menu-link">
                    <span>👥</span>
                    コミュニティ
                </a>

                <a href="../add-pin.html" class="mobile-menu-link">
                    <span>⌖</span>
                    追加（ピン）
                </a>

                <a href="messages.html" class="mobile-menu-link">
                    <span>✉</span>
                    メッセージ
                </a>

                <a href="profile.html" class="mobile-menu-link">
                    <span>◎</span>
                    マイアカウント
                </a>
            </nav>
        </aside>
    </div>

    <!-- Homeと同じヘッダー -->
    <header class="site-header">
        <div class="header-inner">
            <a href="../home.html" class="site-logo">
                <div class="pop-logo">
                    <span class="c1">お</span>
                    <span class="c2">き</span>
                    <span class="c3">と</span>
                    <span class="c4">ー</span>
                    <span class="c4">ー</span>
                    <span class="c4">ー</span>
                    <span class="c4">ー</span>
                    <span class="c5">く</span>
                </div>
            </a>

            <nav class="header-nav">
                <a href="search.html" class="header-link" aria-current="page">検索</a>
                <a href="community.html" class="header-link">コミュニティ</a>
                <a href="../add-pin.html" class="header-link">追加（ピン）</a>
                <a href="messages.html" class="header-link">メッセージ</a>
                <a href="profile.html" class="header-link">マイアカウント</a>
            </nav>
        </div>
    </header>

    <div class="search-layout">

        <!-- Homeと同じ左メニュー -->
        <aside class="side-menu" aria-label="メインメニュー">
            <div class="side-background" aria-hidden="true">
                <img src="../../../images/okinawa-sidebar.png" alt="">
            </div>

            <nav class="side-navigation">
                <a href="../home.html" class="side-link">
                    <span class="side-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/><path d="M9.5 20v-6h5v6"/></svg>
                    </span>
                    <span class="side-label">ホーム</span>
                </a>

                <a href="search.html" class="side-link active" aria-current="page">
                    <span class="active-line" aria-hidden="true"></span>
                    <span class="side-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.7"/><path d="m16 16 4.5 4.5"/></svg>
                    </span>
                    <span class="side-label">検索</span>
                </a>

                <a href="community.html" class="side-link">
                    <span class="side-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3.5 19c.2-4 2.2-6 5.5-6s5.3 2 5.5 6"/><path d="M14.5 14c3.4-.7 5.7 1 6 4.5"/></svg>
                    </span>
                    <span class="side-label">コミュニティ</span>
                </a>

                <a href="../add-pin.html" class="side-link">
                    <span class="side-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24"><path d="M12 21s6-5.1 6-11a6 6 0 1 0-12 0c0 5.9 6 11 6 11Z"/><circle cx="12" cy="10" r="2"/></svg>
                    </span>
                    <span class="side-label">追加（ピン）</span>
                </a>

                <a href="messages.html" class="side-link">
                    <span class="side-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>
                    </span>
                    <span class="side-label">メッセージ</span>
                    <span class="side-notification" aria-label="未読3件">3</span>
                </a>

                <a href="profile.html" class="side-link">
                    <span class="side-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 20c.4-4.3 3-6.5 7.5-6.5s7.1 2.2 7.5 6.5"/></svg>
                    </span>
                    <span class="side-label">マイアカウント</span>
                </a>
            </nav>
        </aside>

        <!-- ここから検索ページの元の中身（変更なし） -->
        <main class="search-page">
            <section class="search-hero">
                <p>DISCOVER OKINAWA</p>
                <h1>沖縄の人と投稿を検索</h1>

                <form id="searchForm" class="search-box">
                    <input
                        id="searchInput"
                        type="search"
                        placeholder="名前、ユーザー名、投稿内容を検索"
                        autocomplete="off"
                    >
                    <button class="button" type="submit">検索</button>
                </form>
            </section>

            <section class="search-results">
                <div class="search-section">
                    <h2>アカウント</h2>
                    <div id="peopleList" class="people-list"></div>
                    <p id="peopleEmpty" class="empty-search">該当するアカウントはありません。</p>
                </div>

                <div class="search-section">
                    <h2>投稿</h2>
                    <div id="postSearchList" class="post-search-list"></div>
                    <p id="postEmpty" class="empty-search">該当する投稿はありません。</p>
                </div>
            </section>
        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="../../js/pages/search.js"></script>
</body>

</html>
